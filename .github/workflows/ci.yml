name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Cloud Firestore Emulator JAR
        id: emulator-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-fbtools-15.37.0

      - name: Download Cloud Firestore Emulator JAR
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: npx --yes firebase-tools@15.37.0 setup:emulators:firestore

      - name: Run Firestore Security Rules suite
        run: npm run test:rules

