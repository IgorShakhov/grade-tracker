name: Bug Report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Briefly describe the bug and what you expected instead.
      placeholder: e.g. Entering 85.5% in Midterm 1 didn't update the target calculator...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Browser (optional)
      placeholder: e.g. iPhone Safari / MacBook Chrome
